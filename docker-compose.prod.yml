name: misimpresiones-prod

# Producción: imágenes construidas, sin montar código, sin puertos publicados.
# El backend migra la base al arrancar (backend/app/migrar.py): si hay migraciones
# pendientes saca antes un respaldo en ./data/respaldos y, si no puede, no migra.
# El acceso público va por el túnel (perfil `tunnel`) + Worker estable de workers.dev.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - ./data/postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  backend:
    build:
      context: ./backend
      target: runtime
    # Solo lo que el backend necesita: el .env completo trae el token de Cloudflare y la contraseña
    # del admin, que un backend comprometido no debe poder leer de su propio entorno.
    environment:
      TZ: America/Bogota
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      MEDIA_DIR: ${MEDIA_DIR:-/media}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      WHATSAPP_NEGOCIO: ${WHATSAPP_NEGOCIO:-}
      # Cloudflare Turnstile (reCAPTCHA de Cloudflare) en login y pedidos; vacío = apagado.
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
      TURNSTILE_SECRETKEY: ${TURNSTILE_SECRETKEY:-}
      # Solo para `make prod-admin` (create_admin); el servidor web no los usa.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MIGRAR_AL_ARRANCAR: ${MIGRAR_AL_ARRANCAR:-1}
    # El usuario del anfitrión: respaldos e imágenes quedan legibles por quien administra.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./data/respaldos:/respaldos
      - ./data/imagenes:/media
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: always

  # Impresora Bambu Lab A1 (por la VPN a la red local): detecta los trabajos, guarda el estado y
  # atiende los controles del panel. La IP, el serial, el código de acceso y la cuenta de Bambu Cloud
  # se configuran en el panel (Administración → Conexión) y viven cifrados en la base: por eso este
  # servicio necesita SECRET_KEY (la misma del backend) para descifrarlos.
  impresora:
    build:
      context: ./backend
      target: runtime
    # Sin arrancar.sh: la migración la hace el backend, que este servicio espera sano.
    entrypoint: ["python", "-m", "app.impresora.servicio"]
    environment:
      TZ: America/Bogota
      # No sirve a nadie ni firma sesiones; solo usa SECRET_KEY para descifrar la configuración.
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      # SOLO para importar UNA vez a la base lo que ya tenías en el .env (después se pueden borrar).
      BAMBU_IP: ${BAMBU_IP:-}
      BAMBU_SERIAL: ${BAMBU_SERIAL:-}
      BAMBU_ACCESS_CODE: ${BAMBU_ACCESS_CODE:-}
      BAMBU_NUBE_DIAS: ${BAMBU_NUBE_DIAS:-7}
    volumes:
      # Solo lectura de una vez: importa el token viejo de `make bambu-login` (ya retirado), si existe.
      - ./data/nube:/nube
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      TZ: America/Bogota
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:8000
      NOMBRE_NEGOCIO: ${NOMBRE_NEGOCIO:-Mis impresiones}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    command: npm run start
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # Quick tunnel hacia el frontend. Solo con: --profile tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://frontend:3000
    environment:
      TZ: America/Bogota
    depends_on:
      - frontend
    restart: always
    profiles: [tunnel]

  # Mantiene el Worker de workers.dev apuntando a la URL vigente del túnel (ver docs/tunel-cloudflare.md).
  urlsync:
    image: python:3.13-slim
    command: python /cloudflare/urlsync/urlsync.py
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      WORKER_NOMBRE: ${WORKER_NOMBRE:-misimpresiones}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      WORKER_CODIGO: /cloudflare/worker/index.js
    volumes:
      - ./cloudflare:/cloudflare:ro
    depends_on:
      - cloudflared
    restart: always
    profiles: [tunnel]
